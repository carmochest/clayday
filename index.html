:root{
  --ink:#2A1F2E; --ink-2:#6F6275; --ink-3:#A79CAB; --line:rgba(42,31,46,.09);
  --panel:rgba(255,253,250,.94); --panel-solid:#FFFDFA; --chip:rgba(42,31,46,.06); --chip-2:rgba(42,31,46,.11); --on:#2A1F2E; --on-ink:#FFFDFA;
  --accent:#F06051; --good:#5FAE55; --maid:#E6DDF0; --maid-i:#5B4670;
  --shadow:0 1px 2px rgba(42,31,46,.05),0 14px 34px rgba(42,31,46,.10);
  --font:"PP Mori",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sky-ink:var(--ink);--sky-ink-2:var(--ink-2);--sky-on:var(--on);--sky-on-ink:var(--on-ink);--sky-chip:var(--chip)
}
:root[data-sky="dark"]{--sky-ink:#FFF6EC;--sky-ink-2:rgba(255,246,236,.72);--sky-on:#FFF6EC;--sky-on-ink:#2A1F2E;--sky-chip:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html{height:100%;color-scheme:light;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:#F5EFE8;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;padding-inline:12px;padding-block:12px 48px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .18s var(--ease),background .18s var(--ease),color .18s var(--ease),opacity .18s var(--ease),box-shadow .18s var(--ease)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.wrap{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 4px}
.top h1{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1;color:var(--sky-ink);font-variant-numeric:tabular-nums}
.top small{display:block;font-size:12.5px;font-weight:400;color:var(--sky-ink-2);margin-top:4px;white-space:nowrap}
.top small button{color:var(--sky-ink-2);text-decoration:underline;text-underline-offset:3px;font-size:12.5px;margin-left:6px}
.wknav{display:flex;gap:2px}
.wknav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:18px}
.wknav button:active{background:var(--chip-2)}
.wknav #wkToday{font-size:9px;color:var(--accent)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap;text-align:center}
.seg button.on{background:var(--on);color:var(--on-ink);box-shadow:0 2px 8px rgba(42,31,46,.18)}
.seg button[disabled]{opacity:.35;cursor:default}
.seg.sm button{padding:6px 11px;font-size:13px}
.top .seg{background:var(--sky-chip)} .top .seg button{color:var(--sky-ink-2)} .top .seg button.on{background:var(--sky-on);color:var(--sky-on-ink)}

.card{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;box-shadow:var(--shadow);padding:16px 16px;animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.big{font-size:46px;font-weight:600;letter-spacing:-.025em;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.sub .skip{color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;margin-left:8px;font-size:13px}
.sub .last{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-3)}
.sub{color:var(--ink);font-weight:600}
.nowgrid{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.state{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.state button{padding:11px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink-2);text-align:center;flex:1;white-space:nowrap}
.state button.on{background:var(--on);color:var(--on-ink);box-shadow:0 2px 8px rgba(42,31,46,.18)}
.btn{border-radius:16px;padding:14px 16px;font-weight:600;font-size:16px;background:var(--chip);color:var(--ink);text-align:center;white-space:nowrap}
.btn:active{background:var(--chip-2)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(240,96,81,.28)}
.btn.primary:active{background:#E2503F;box-shadow:0 2px 8px rgba(240,96,81,.25)}
.btn.big{padding:16px;font-size:17px}
.btn.quiet{background:transparent;color:var(--ink-2)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:999px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts.three{grid-template-columns:1.45fr 1fr 1fr}
.acts.three .btn{padding:14px 6px;font-size:15px}
.acts .full{grid-column:1/-1}
.pick{margin-top:10px;background:var(--chip);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;animation:rise .25s var(--ease) both}
.pick .pre{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick .pre button{border-radius:12px;padding:12px 6px;background:var(--panel-solid);font-weight:600;font-size:15px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pick .pre button.on{background:var(--on);color:var(--on-ink)}
.pick .cust{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .cust label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:600;min-width:0}
.pick input{width:100%;font:inherit;font-weight:600;font-size:16px;background:var(--panel-solid);border:0;border-radius:10px;padding:10px 10px;color:var(--ink);min-width:0}
.pick input::-webkit-calendar-picker-indicator{display:none}
.pick .go{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .go .btn{border-radius:12px;padding:12px}
.intake{margin-top:14px}
.intake .l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:6px;gap:8px}
.intake .l b{color:var(--ink);font-weight:600}
.intake .bar{height:7px;border-radius:999px;background:var(--chip);overflow:hidden}
.intake .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s var(--ease)}
.feedlog summary{list-style:none;cursor:pointer;display:block}
.feedlog summary::-webkit-details-marker{display:none}
.feedlog .logbtn{display:flex;justify-content:center;align-items:center;margin-top:10px;background:var(--chip);border-radius:12px;padding:11px 12px;font-weight:600;font-size:14px;color:var(--ink);transition:background .18s var(--ease)}
.feedlog[open] .logbtn{background:var(--chip-2)}
.feedlog .arr{width:26px;height:26px;border-radius:50%;background:var(--panel-solid);display:grid;place-items:center;color:var(--ink-2);font-size:14px;transition:transform .25s var(--ease)}
.feedlog[open] .arr{transform:rotate(180deg)}
.feedlog>div{margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
.fl{display:grid;grid-template-columns:50px 1fr auto auto;align-items:center;gap:8px;padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.fl:last-child{border-bottom:0}
.fl .t{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.fl .who{color:var(--ink-3);font-size:12px}
.fl button{color:var(--ink-3);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:15px}
.fl button:active{background:var(--chip-2)}
.fl .tot{grid-column:1/-1;display:flex;justify-content:space-between;color:var(--ink-2);font-size:12.5px;padding-top:6px}

.now h2{margin:0 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.row{display:grid;grid-template-columns:30px 88px 1fr;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row .e{font-size:20px;line-height:1;text-align:center}
.row .n{font-weight:600}
.row .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s small{color:var(--ink-3);margin-left:6px;font-size:12.5px}
.row.sec .n,.row.sec .s{color:var(--ink-2);font-weight:500}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:2px 0}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--sky-ink-2);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.wd b{font-size:16px;font-weight:600;color:var(--sky-ink);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;transition:background .2s var(--ease),color .2s var(--ease)}
.wd.on b{background:var(--sky-on);color:var(--sky-on-ink)}
.wd.today:not(.on) b{color:var(--accent)}

.agenda{padding:10px 6px 6px}
.agenda .head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 10px 8px}
.agenda .head h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.list{max-height:min(600px,66vh);overflow-y:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 5%,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 5%,#000 93%,transparent 100%);padding:4px 0 26px;scroll-behavior:smooth}
.list::-webkit-scrollbar{display:none}
.it{display:grid;grid-template-columns:54px 1fr;align-items:baseline;gap:8px;padding:10px 12px;border-radius:14px;font-size:15.5px}
.it .tm{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13.5px;font-weight:600}
.it .lb{font-weight:600;min-width:0}
.it .lb small{display:block;font-weight:400;color:var(--ink-2);font-size:13px;margin-top:1px}
.it.past{opacity:.45}
.it.cur{background:linear-gradient(90deg,rgba(200,232,190,0) 0%,#DCF0D5 12%,#DCF0D5 88%,rgba(200,232,190,0) 100%);position:relative}
.it.cur::before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:3px;border-radius:3px;background:#5FAE55}
.it.cur .tm{color:#2F7A2A}
.it.cur .lb{color:#1F4D1B}
.it.next{background:linear-gradient(90deg,rgba(200,232,190,0) 0%,#EEF7EA 12%,#EEF7EA 88%,rgba(200,232,190,0) 100%)}
.it.next .tm{color:#5FAE55}

(function(){

  const KEYS=[[0,["#2A2140","#3E2E55","#5B3F63","#4A3A60","#F3E6D0"]],[5,["#3B2C52","#7A4F6E","#E9A58A","#8E6288","#FFE3B0"]],[7,["#F7C6A4","#F3D6C0","#DCE6EA","#FFFFFF","#FFE49A"]],[10,["#BFE3F1","#DFEFF5","#F5EFE8","#FFFFFF","#FFE49A"]],[15,["#CFE6F0","#EDE4E8","#F8E7D8","#FFFFFF","#FFE49A"]],[18,["#F0A67A","#EBB6B0","#B79BC0","#F6D3C6","#FFCF7A"]],[20,["#4A3462","#7A5578","#E1917E","#8E6288","#F3E6D0"]],[24,["#2A2140","#3E2E55","#5B3F63","#4A3A60","#F3E6D0"]]];
  const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const mix=(a,b,f)=>{ const A=hex(a),B=hex(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(",")})`; };

  const clouds=Array.from({length:6},(_,i)=>({x:Math.random(),y:0.06+Math.random()*0.4,s:0.6+Math.random()*0.9,v:(0.004+Math.random()*0.006)*(i%2?1:0.7)}));
  function cloud(x,y,s,c){ ctx.fillStyle=c; const r=22*s; [[0,0,r*1.15],[-r*1.1,r*0.25,r*0.8],[r*1.1,r*0.2,r*0.9],[r*0.4,-r*0.55,r*0.75],[-r*0.45,-r*0.4,r*0.65]].forEach(([dx,dy,rr])=>{ ctx.beginPath(); ctx.arc(x+dx,y+dy,rr,0,7); ctx.fill(); }); ctx.fillRect(x-r*1.6,y+r*0.2,r*3.2,r*0.85); ctx.beginPath(); ctx.arc(x-r*1.6,y+r*0.62,r*0.42,0,7); ctx.arc(x+r*1.6,y+r*0.62,r*0.42,0,7); ctx.fill(); }
  function stars(a){ ctx.fillStyle=`rgba(255,240,220,${a})`; let r=12; for(let i=0;i<70;i++){ r=(r*9301+49297)%233280; const x=(r/233280)*W; r=(r*9301+49297)%233280; const y=(r/233280)*H*0.6; r=(r*9301+49297)%233280; const s=0.6+(r/233280)*1.4; ctx.beginPath(); ctx.arc(x,y,s,0,7); ctx.fill(); } }
  function frame(now){ const h=bkkNow().hf; const [c0,c1,c2,cc,cd]=skyAt(h);

    const g2=ctx.createLinearGradient(0,H*0.7,0,H); g2.addColorStop(0,"rgba(255,255,255,0)"); g2.addColorStop(1,"rgba(255,250,242,.5)"); ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
    if(!reduce) requestAnimationFrame(frame); }
  function size(){ const dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); if(reduce) frame(performance.now()); }
